name: Flutter CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'tool/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: Unit/Widget tests
  unit_tests:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Seed gitignored config files
        run: |
          # .env is declared as a Flutter asset in pubspec.yaml but is
          # gitignored. Seed from the example so asset bundling succeeds.
          cp .env.example .env

          # firebase_options.dart is generated by `flutterfire configure`
          # and is gitignored. Unit tests don't run main(), so an inert
          # stub is sufficient to satisfy the Dart compiler.
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
                  apiKey: 'stub',
                  appId: 'stub',
                  messagingSenderId: 'stub',
                  projectId: 'stub',
                );
          }
          DART

      - name: Run tests
        run: flutter test --no-pub --coverage

      - name: Check coverage threshold
        run: dart run tool/check_coverage.dart


