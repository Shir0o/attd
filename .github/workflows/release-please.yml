name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Open / update release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # release-please reads PR titles (squashed merge commits onto main
      # carry the PR title) as the conventional-commits signal. It then
      # opens or updates a release PR that bumps pubspec.yaml, regenerates
      # CHANGELOG.md, and tags a GitHub Release on merge.
      - name: Run release-please
        uses: googleapis/release-please-action@v5
        with:
          # RELEASE_PLEASE_TOKEN is a PAT with contents:write and
          # pull-requests:write. GITHUB_TOKEN works for single-repo PRs
          # but a PAT is recommended for forks and avoids the per-job
          # permission cap. See RELEASING.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Fork PRs won't get releases; only direct pushes to main.
          fork: false
