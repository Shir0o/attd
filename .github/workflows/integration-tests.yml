name: Integration Tests
run-name: ${{ github.event_name == 'pull_request' && format('Integration Tests (PR #{0})', github.event.pull_request.number) || 'Integration Tests' }}

on:
  schedule:
    - cron: '0 3 * * *' # 3 AM UTC daily
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, labeled, reopened]
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'tool/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration_tests:
    name: Firebase Test Lab Integration Tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:integration-test'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Seed gitignored config files
        run: |
          # .env is declared as a Flutter asset in pubspec.yaml but is
          # gitignored. Seed from the example so asset bundling succeeds.
          cp .env.example .env

          # firebase_options.dart is generated by `flutterfire configure`
          # and is gitignored. The integration job builds the full APK
          # which compiles main.dart, so the import must resolve. Runtime
          # Firebase config still comes from the google-services.json
          # secret above; this stub only satisfies the Dart compiler.
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
                  apiKey: 'stub',
                  appId: 'stub',
                  messagingSenderId: 'stub',
                  projectId: 'stub',
                );
          }
          DART

      - name: Bootstrap Android project (Generates gradlew)
        run: flutter build apk --debug

      - name: Build App APK (with tests bundled inside)
        run: |
          DART_DEFINES=$(echo -n "IS_TEST_MODE=true" | base64)
          pushd android
          ./gradlew app:assembleDebug \
            -Ptarget=$(pwd)/../integration_test/all_tests.dart \
            -Pdart-defines="$DART_DEFINES"
          popd

      - name: Build Test APK (The Android wrapper)
        run: |
          pushd android
          ./gradlew app:assembleAndroidTest
          popd

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Run on Firebase Test Lab
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app build/app/outputs/flutter-apk/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=MediumPhone.arm,version=35,locale=en,orientation=portrait \
            --timeout 10m \
            --results-dir=integration-tests/${{ github.run_id }}
