name: Release

# Triggered when release-please pushes a version tag (e.g. v1.3.3+25).
# Builds a signed APK + AAB, attaches both to the GitHub Release, and
# uploads the AAB to the Play Console internal testing track via
# fastlane supply. Production promotion stays a manual Play Console click.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, attach, and upload release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production  # requires approvals configured in repo settings
    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify all release secrets are present
        id: check-secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          PLAY_SUPPLY_JSON_KEY: ${{ secrets.PLAY_SUPPLY_JSON_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for var in ANDROID_KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD PLAY_SUPPLY_JSON_KEY; do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            echo "::error::See RELEASING.md for setup instructions."
            exit 1
          fi
          echo "All release secrets present."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Seed .env and firebase_options.dart for asset bundling
        run: |
          cp .env.example .env
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart';
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
                  apiKey: 'stub', appId: 'stub',
                  messagingSenderId: 'stub', projectId: 'stub',
                );
          }
          DART

      - name: Assemble CI keystore and key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.keystores
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ~/.keystores/upload-key.keystore
          chmod 600 ~/.keystores/upload-key.keystore
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$HOME/.keystores/upload-key.keystore
          EOF
          chmod 600 android/key.properties
          echo "CI keystore and key.properties assembled (file contents not echoed)."

      - name: Bootstrap Android project (Generates gradlew)
        run: flutter build apk --debug
        env:
          # Use the stubbed credentials only for the bootstrap step.
          CI: 'true'

      - name: Build signed release AAB
        run: flutter build appbundle --release

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Locate built artifacts
        id: locate
        run: |
          set -euo pipefail
          AAB=$(find build/app/outputs/bundle/release -name '*.aab' | head -n1)
          APK=$(find build/app/outputs/flutter-apk -name 'app-release.apk' | head -n1)
          if [ -z "$AAB" ] || [ -z "$APK" ]; then
            echo "::error::Built artifacts not found. Expected AAB and APK under build/app/outputs/."
            exit 1
          fi
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Located AAB=$AAB and APK=$APK"

      - name: Attach AAB and APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false  # release-please already wrote them
          files: |
            ${{ steps.locate.outputs.aab }}
            ${{ steps.locate.outputs.apk }}

      - name: Determine if this is a pre-release tag
        id: prerelease
        run: |
          tag="${{ github.ref_name }}"
          if [[ "$tag" == *-rc* || "$tag" == *-beta* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB to Play Console internal track
        if: steps.prerelease.outputs.is_prerelease != 'true'
        env:
          PLAY_SUPPLY_JSON_KEY: ${{ secrets.PLAY_SUPPLY_JSON_KEY }}
        run: |
          set -euo pipefail
          echo "$PLAY_SUPPLY_JSON_KEY" > fastlane/play-supply-credentials.json
          chmod 600 fastlane/play-supply-credentials.json
          bundle install --quiet
          bundle exec fastlane play_upload
          rm -f fastlane/play-supply-credentials.json
          echo "Uploaded to Play Console internal track."

      - name: Skip Play Console upload for pre-release tag
        if: steps.prerelease.outputs.is_prerelease == 'true'
        run: |
          tag="${{ github.ref_name }}"
          echo "Tag $tag matches a pre-release pattern (rc/beta); skipping Play Console upload."