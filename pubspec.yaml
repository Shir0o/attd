name: attendance_tracker
description: A simple, privacy-focused attendance tracking application.
version: 1.18.1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  google_sign_in: ^7.0.0
  uuid: ^4.5.1
  path_provider: ^2.1.3
  path: ^1.9.1
  intl: ^0.20.2
  googleapis: '>=16.0.0 <18.0.0'
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  share_plus: ^13.0.0
  archive: ^4.0.9
  shared_preferences: ^2.5.4
  google_fonts: '>=8.0.2 <9.0.0'
  firebase_core: ^4.6.0
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.1
  local_auth: '>=3.0.2 <4.0.0'
  quick_actions: ^1.0.7
  workmanager: ^0.10.9
  firebase_crashlytics: ^5.3.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  yaml: ^3.1.3
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/icon.png
    - assets/icon/foreground.png
    - assets/fonts/
    - cloud_version_history.webp
    - settings_signed_in.webp
    - settings_not_signed_in.webp
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
